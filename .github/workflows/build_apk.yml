name: Build Releases (Windows Installer & Android APK)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            libffi-dev libssl-dev \
            build-essential ccache \
            libncurses5 libncurses5-dev libncursesw5 \
            pkg-config autoconf libtool \
            zlib1g-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Set up Android SDK/NDK cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-*
          key: android-sdk-ndk-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: android-sdk-ndk-

      - name: Build APK
        working-directory: android
        run: |
          buildozer android debug 2>&1 | tee build.log
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "yes"

      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find android/bin -name "*.apk" | head -1)
          cp "$APK" ./deepfeik-android-arm64.apk
          echo "APK_PATH=./deepfeik-android-arm64.apk" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepfeik-android-apk
          path: ${{ steps.find_apk.outputs.APK_PATH }}

  build-windows:
    name: Build Windows App & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone app with PyInstaller
        run: |
          pyinstaller --noconfirm deepfeik.spec

      - name: Create Portable Windows Zip
        run: |
          Compress-Archive -Path dist/deepfeik -DestinationPath ./deepfeik-windows-x64-portable.zip

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepfeik-windows-portable
          path: ./deepfeik-windows-x64-portable.zip

  publish-release:
    name: Publish Unified GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: deepfeik-android-apk
          path: ./release_assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: deepfeik-windows-portable
          path: ./release_assets

      - name: Publish GitHub Release with all assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          name: deepfeik ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          body: |
            ## deepfeik Releases

            ### 📱 Android APK
            - **`deepfeik-android-arm64.apk`**: Real-time face swap app for Android 10+ (API 29+).
            - Install instructions:
              1. Download `deepfeik-android-arm64.apk`
              2. Enable **Install unknown apps** in Android Settings
              3. Open APK and grant Camera / Storage permissions on first launch.

            ### 💻 Windows Application (x64)
            - **`deepfeik-windows-x64-portable.zip`**: Standalone executable package for Windows 10/11 (64-bit). No Python installation required.
            - Install instructions:
              1. Download and extract `deepfeik-windows-x64-portable.zip`
              2. Run `deepfeik.exe` inside the folder.
              3. Live webcam swap with keyboard shortcuts (Ctrl+O, Ctrl+V, Ctrl+R, Esc).

            ### 🌟 Features
            - Resizable dark glassmorphism GUI
            - Natural mouth opening tracking (no smeared speech artifacts)
            - Real-time adaptive Reinhard LAB skin tone fitting with EMA smoothing
            - Real-time video recording (MP4)
          files: ./release_assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
