[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfeik"
version = "1.0.0"
description = "Real-time face swap desktop app using your webcam"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "numpy>=1.24",
    "PyQt5>=5.15",
    "Pillow>=10.0",
    "scipy>=1.11",
]

[project.scripts]
deepfeik = "deepfeik.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
