name: Build Releases (Windows Installer & Android APK)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Build standalone app with PyInstaller (Single-File Executable)
        run: |
          pyinstaller --noconfirm deepfeik.spec

      - name: Run Automated Standalone Executable Verification Test
        run: |
          python -m pytest tests/test_standalone_app.py -v

      - name: Attach Windows Executable & Installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          name: deepfeik ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          files: |
            dist/deepfeik.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            libffi-dev libssl-dev \
            build-essential ccache \
            libncurses5 libncurses5-dev libncursesw5 \
            pkg-config autoconf libtool \
            zlib1g-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Build APK
        working-directory: android
        run: |
          buildozer android debug
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "yes"

      - name: Locate and Attach APK to Release
        run: |
          APK=$(find android/bin -name "*.apk" | head -1)
          cp "$APK" ./deepfeik-android-arm64.apk
          echo "Found APK: $APK"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          name: deepfeik ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          files: ./deepfeik-android-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
