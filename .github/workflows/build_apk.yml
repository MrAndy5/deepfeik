name: Build Releases (Windows Installer & Android APK)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Build standalone app with PyInstaller (Single-File Executable)
        run: |
          pyinstaller --noconfirm deepfeik.spec

      - name: Run Automated Standalone Executable Verification Test
        run: |
          python -m pytest tests/test_standalone_app.py -v

      - name: Create Portable Windows Zip
        run: |
          New-Item -ItemType Directory -Force -Path dist\deepfeik-portable
          Copy-Item dist\deepfeik.exe dist\deepfeik-portable\deepfeik.exe
          Compress-Archive -Path dist\deepfeik-portable\* -DestinationPath ./deepfeik-windows-x64-portable.zip -Force

      - name: Attach Windows Executable & Installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          name: deepfeik ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          files: |
            dist/deepfeik.exe
            deepfeik-windows-x64-portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip \
            libffi-dev libssl-dev \
            build-essential ccache \
            libncurses5 libncurses5-dev libncursesw5 \
            pkg-config autoconf libtool \
            zlib1g-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Set up Android SDK/NDK cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-*
          key: android-sdk-ndk-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: android-sdk-ndk-

      - name: Build APK
        working-directory: android
        run: |
          buildozer android debug
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "yes"

      - name: Locate and Attach APK to Release
        run: |
          APK=$(find android/bin -name "*.apk" | head -1)
          cp "$APK" ./deepfeik-android-arm64.apk
          echo "Found APK: $APK"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          name: deepfeik ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          files: ./deepfeik-android-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
